name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Validate + link the content pack. Fails loudly on any new schema or cross-reference error; the known pack
      # errors recorded in content-pack/BUILD-ERRORS.md (and shown on /methods) are accepted until the pack fixes them.
      - run: npm run build:content -- --accept-known
      # End-to-end suite against a root build, then the Pages build under /<repo>/.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: BASE_PATH="/${{ github.event.repository.name }}/" npm run build
      - run: cp dist/index.html dist/404.html   # SPA fallback for deep links on GitHub Pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

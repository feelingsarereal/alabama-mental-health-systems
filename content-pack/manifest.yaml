plain_abstract: 'Alabama''s mental health system is not one system. A state agency and its contracted community
  centers, Medicaid and private insurers, hospitals, schools, courts and jails, housing coalitions and hundreds
  of nonprofits together decide whether a person can find help, afford it, reach it and keep it. This report by
  Little Orange Fish describes all of them in one place: eight domains adapted from the World Health Organization''s
  health-system building blocks, and four sections on the systems outside the Department of Mental Health that shape
  outcomes. This site presents the October 2026 draft after every claim in it was checked against its cited source.
  You can read the report with each sentence''s source one hover away, see what the check changed and what it could
  not settle, explore how the domains depend on one another, and compare Alabama''s counties with one another and
  Alabama with the other states on maps built from public data. It is a draft for review, not an approved or peer-reviewed
  publication.'

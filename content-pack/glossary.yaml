- id: state-mental-health-planning-council
  term: State mental health planning council
  kind: science
  category: organisation
  variants:
  - state mental health planning council
  - State planning council
  - planning council
  short: A council every state must keep as a condition of the federal mental health block grant, with people who
    use services among its members.
  definition: Federal law requires a state that takes the Mental Health Block Grant to "establish and maintain a
    State mental health planning council" [73]. The council reviews the state's block-grant plan, speaks for adults
    with serious mental illness and children with serious emotional disturbance, and each year reviews whether services
    are adequate [73]. At least half its members must be people who are neither state employees nor providers [73].
    It is one of the few standing channels for consumer and family input to ADMH.

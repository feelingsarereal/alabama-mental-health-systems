  - probate judge
  - probate judges
  short: The county court that, in Alabama, hears petitions for civil commitment. Each county has a probate judge.
  definition: 'Probate courts are county courts best known for wills and estates. In Alabama they also hear civil-commitment
    petitions: a petition is filed in the probate court of the county where the person is, and the probate judge
    holds the hearing and issues the order [66]. That makes probate judges regular partners of the mental health
    system, which is why SB236 gives them a seat on the executive committees of larger regional boards [61].'

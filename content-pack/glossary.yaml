- id: lethal-means
  term: Lethal means
  kind: methods
  category: framework
  variants:
  - lethal means
  - lethal-means
  short: The method a person might use to end their life. Putting time and distance between a person in crisis and
    a gun or drugs lowers risk.
  definition: In suicide prevention, "lethal means" are the things a person in crisis could use to die, most often
    firearms and medications. Because many crises pass, making those means harder to reach for a while is a prevention
    strategy in its own right. Alabama's Houston Hunter Act, with its voluntary firearm-hold agreements, is a lethal-means
    measure [64].
  see:

- id: admh
  term: Alabama Department of Mental Health (ADMH)
  kind: science
  category: organisation
  variants:
  - ADMH
  - Alabama Department of Mental Health
  - Department of Mental Health
  short: The state agency responsible for public mental health, substance use and developmental disability services
    in Alabama.
  definition: 'The state mental health authority, created by statute in 1965 [51]. It operates the state psychiatric
    hospitals, certifies and contracts with community providers, and administers federal grants and the CCBHC demonstration
    [16] [52]. It has three divisions: Mental Health and Substance Use Services, Developmental Disabilities, and
    Administration [16]. More than half of its budget pays for developmental-disability services rather than mental
    health care [16].'

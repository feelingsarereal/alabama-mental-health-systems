- id: sb101-consent-age
  term: 'SB101 (Act 2025-455): age of consent for treatment'
  kind: science
  category: law
  variants:
  - SB101
  - Act 2025-455
  short: A 2025 Alabama law raising from 14 to 16 the age at which a minor can consent alone to medical and mental
    health treatment.
  definition: SB101 raised the age of independent consent for medical and mental-health treatment from 14 to 16,
    effective 1 October 2025 [59] [60]. In schools it means students under 16 cannot take part in ongoing counseling
    without written permission from a parent [59] [60]. The statute makes exceptions for an imminent threat to health,
    suspected abuse or neglect, and an immediate need for grief counseling [59].

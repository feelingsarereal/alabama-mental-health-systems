- id: parental-opt-in
  term: Parental opt-in consent for school mental health services (Act 2022-442)
  kind: science
  category: law
  variants:
  - Act 2022-442
  - opt-in
  short: Since 2022 Alabama schools need a parent's written permission before a student receives ongoing mental
    health services.
  definition: 'Act 2022-442 requires schools to give parents annual written notice, to keep mental-health records
    apart from academic records and to obtain written permission before mental-health services, at first for students
    under 14 [121] [60]. SB101 raised the age to 16 from October 2025 [59]. "Opt-in" means the default is no service:
    nothing happens unless the parent says yes. Instruction, advisement and occasional interventions fall outside
    the rule [60] [121]. The same Act required every district to employ a mental health services coordinator [60]
    [121].'

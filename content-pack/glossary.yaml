- id: civil-commitment
  term: Civil commitment
  kind: science
  category: law
  variants:
  - civil commitment
  - civil-commitment
  - probate commitment
  short: A court order requiring a person with mental illness to accept treatment because they pose a serious danger.
    It is not a criminal matter.
  definition: Civil commitment is involuntary treatment ordered by a court outside the criminal process. In Alabama
    any person may petition the probate court; the judge may order inpatient treatment on clear and convincing evidence
    that the person has a mental illness, poses a real and present threat of substantial harm to self or others,
    will keep deteriorating without treatment and cannot make a rational decision about it [66]. Initial orders
    run up to 150 days and renewals up to one year [66]. No annual count of commitments was found in the Department's
    published reports as of October 2026.
  concept: civil-commitment

  short: A payment set in advance. A CCBHC gets one fixed amount for each day it gives a Medicaid enrollee a qualifying
    service, whatever the service.
  definition: '"Prospective" means the rate is fixed ahead of time from the clinic''s expected costs, not billed
    item by item afterwards. Alabama uses the daily method, PPS-1: one payment for each day on which at least one
    qualifying service is delivered to a Medicaid enrollee [105]. Each clinic''s rate is built from a cost report
    of the total cost of running the CCBHC [285], so the rate can carry work that fee schedules do not pay for,
    such as care coordination. It applies to Medicaid enrollees only [105].'

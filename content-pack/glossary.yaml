  short: Treatment meant to make a defendant found incompetent able to stand trial. Until it happens the criminal
    case is on hold.
  definition: 'When a court finds a defendant incompetent, the state must provide treatment aimed at restoring competency,
    so the case can go ahead. In Alabama this has mostly meant a bed at Taylor Hardin, and people wait in county
    jails for one [32]. The part of the Hunter consent decree that covers inpatient restoration has been extended
    to 31 January 2027 [11]. Restoration is a legal goal, not the same as recovery: its aim is the ability to take
    part in a trial.'

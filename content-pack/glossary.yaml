    outpatient mental health and substance use treatment, primary-care screening, targeted case management, peer
    and family support and services for veterans, and it is paid a daily prospective rate instead of fee-for-service
    [10]. Alabama joined the federal Medicaid demonstration in June 2024 [24]. WellStone and AltaPointe were certified
    in July 2024 [26], and the first two clinics served 30,275 people in FY2025 [16]. Only an ADMH-designated community
    mental health center may become one [10].

- id: service-continuum
  term: Continuum of mental health care
  kind: methods
  category: framework
  variants:
  - Service-Delivery Continuum
  - Continuum lens
  - National Academies' continuum
  - the continuum
  short: The full range of mental health services arranged by intensity, from promotion and prevention through treatment
    and crisis care to recovery supports.
  definition: 'A way of laying services out in a line. The National Academies'' version runs from promotion and
    prevention through treatment to maintenance, which includes long-term care and rehabilitation [2]. This report
    uses promotion and prevention, outpatient treatment, crisis response, inpatient and forensic care, and recovery
    supports. The point of the picture, made in the state mental health directors'' Beyond Beds paper, is that beds
    are only one part: a system also needs each level at enough scale and working hand-offs between them [3]. Each
    domain''s "Continuum lens" asks where along the line Alabama is strong or thin; a HUD Continuum of Care, by
    contrast, is a homelessness planning body.'

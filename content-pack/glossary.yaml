    range of services.
  definition: 'Published by the national association of state mental health directors with the Treatment Advocacy
    Center. Its ten recommendations start with funding a full continuum of psychiatric care and include justice
    diversion, data and linkages between systems [3]. This report borrows its organizing question: whether each
    level of care exists at enough scale and whether the hand-offs between levels work.'

  short: 'The national model for mental health crisis care, built from three parts: a line to call, a team that
    comes out, and a place to go.'
  definition: 'Federal guidance describes a crisis system as three essential elements: someone to contact (988 and
    other lines), someone to respond (mobile crisis teams) and a safe place for help (crisis stabilization services)
    [110]. Alabama built all three after 2020: four in-state 988 call centers, mobile crisis teams and six crisis
    diversion centers [13] [9]. The parts depend on each other. A call line with nowhere to send people, or a center
    nobody is brought to, does little.'

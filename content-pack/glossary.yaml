  term: Readmission rate
  kind: statistics
  category: data
  variants:
  - readmission
  - readmissions
  short: The share of people discharged from a hospital who are admitted again within a set time, usually 30 or
    180 days.
  definition: 'Used as a rough sign of whether discharge and follow-up are working. Alabama''s 30-day readmission
    rate to state hospitals was 1.5 percent in the 2025 reporting year against 9.0 percent nationally [42]. The
    rate rests on very small numbers: one readmission among 68 civil discharges in 2025, and five among 74 in 2024
    [42] [43]. With so few discharges, one or two people move the percentage a long way, so a change from year to

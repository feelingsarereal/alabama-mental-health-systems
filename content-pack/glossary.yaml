  - outpatient forensic evaluations
  - competency
  short: An examination, ordered by a criminal court, of whether a defendant understands the proceedings well enough
    to be tried.
  definition: A person cannot be tried while unable to take part in their own defense. Under Alabama's rules a defendant
    is incompetent if he or she "lacks sufficient present ability to assist in his or her defense by consulting
    with counsel with a reasonable degree of rational understanding" [299]. When the question is raised, the court
    orders an evaluation. The Hunter consent decree limits how long a jailed defendant may wait for one; the Associated
    Press describes its terms as 60 days for evaluation and 30 days for admission to restoration [11] [116].

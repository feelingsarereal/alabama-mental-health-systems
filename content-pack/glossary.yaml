- id: least-restrictive-alternative
  term: Least restrictive alternative
  kind: science
  category: law
  variants:
  - least restrictive alternative
  short: The rule that a court must choose the form of treatment that limits a person's liberty no more than is
    needed.
  definition: 'A principle of mental health law: if treatment in the community would do, a court should not order
    a hospital stay. Alabama''s commitment statute requires the judge to order the least restrictive alternative
    that is necessary and available [66]. The word "available" matters. Where outpatient or residential options
    are thin, the least restrictive alternative in practice may be a hospital bed.'

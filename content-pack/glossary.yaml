    and youth guided, community based, and culturally and linguistically competent [7]. Its principles include individualized
    planning, links across child-serving agencies, early identification and support for the move to adulthood [7].
    A 2021 update keeps these and adds principles on trauma-informed care, integration with physical health, a public
    health approach and equity [210]. ADMH also uses the phrase "system of care" more loosely, for its whole service
    system and for its crisis system [40] [13]; the framework meant here is the children''s one.'

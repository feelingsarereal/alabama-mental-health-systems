- id: clear-and-convincing-evidence
  term: Clear and convincing evidence
  kind: science
  category: law
  variants:
  - clear and convincing evidence
  short: 'A standard of proof: stronger than "more likely than not", weaker than "beyond a reasonable doubt". Alabama
    requires it for commitment.'
  definition: Courts use three main standards of proof. Most civil cases need a preponderance of the evidence, meaning
    more likely than not. Criminal convictions need proof beyond a reasonable doubt. Clear and convincing evidence
    sits between them. Alabama's civil-commitment law requires it before a judge may order someone into treatment
    [66].
  concept: civil-commitment

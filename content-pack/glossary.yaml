  short: The agency in each state that is accountable for the public mental health system and reports on it to the
    federal government. In Alabama it is ADMH.
  definition: Every state names one agency to run its public mental health system, receive the federal mental health
    block grant and report standard figures to the federal government each year [73] [42]. National comparisons
    of spending and people served are comparisons between these agencies, so they leave out care paid for by private
    insurance or delivered outside the public system [23]. Alabama's is the Department of Mental Health [51].

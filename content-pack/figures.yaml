- id: fig-mha
  label: Figure 4
  title: Alabama's rank among the 50 states and the District of Columbia, by measure
  kind: chart
  synthesis: data
  refs:
  - 35
  - 198
  chart:
    type: bar
    x:
      field: measure
      label: Measure
    y:
      field: rank_of_51
      label: Rank of 51 (1 is best)
  data: figures/data/fig-mha.csv
  caption: Alabama's rank on each measure in Mental Health America's State of Mental Health in America 2025. Most
    of the underlying data were collected in 2022 and 2023.
  how_to_read: 'A short bar is a good rank and a long bar a poor one. Read the measures in two groups: the prevalence
    measures, where Alabama sits in the better half, and the access measures, where it sits at or near 51st. Hover
    a bar for Alabama''s value and the national value. A rank says where Alabama stands in the order, not how far
    it is from the next state.'
  explain:
  - 'on': rank
    text: Ranks are of 51; rank 1 is best on every measure.
    concept: reading-the-indicators
  concepts:
  - reading-the-indicators
  discussed_in:

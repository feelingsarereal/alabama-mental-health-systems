  caption: 'The report''s cross-domain dependency map drawn as a graph. Each arrow is one row of the map: the domain
    at the tail conditions the domain at the head, and the row''s Alabama evidence travels with the arrow.'
  how_to_read: Start from any circle. Arrows leaving it show what that part of the system sets the terms for; arrows
    arriving show what it depends on. Select an arrow to read the evidence the report gives for that link, with
    its sources. Select a circle to see the figures the report and its baseline tables hold for that domain. The
    arrows are the report's own reading of how the parts connect; the evidence on each arrow is sourced, the choice
    of arrows is not.

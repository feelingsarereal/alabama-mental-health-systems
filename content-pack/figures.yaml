  data: figures/data/fig-budget-lines.csv
  caption: Enacted General Fund appropriations to the Alabama Department of Mental Health by line, as printed in
    the Legislative Services Agency's comparison sheets for FY2026 and FY2027. Values are as published, not adjusted
    for inflation.
  how_to_read: Each pair of bars is one line of the Department's General Fund budget, the left bar for FY2026 and
    the right for FY2027. The total line dwarfs the others, so switch it off in the legend to compare the programme
    lines. A missing bar means the line did not exist that year; a bar at zero means the line was kept and funded
    at nothing, as with the 988 call centers in FY2027.
  explain:
  - 'on': Total ADMH General Fund
    text: The General Fund is about one-sixth of the Department's revenue, but it pays for what Medicaid does not.
    concept: how-alabama-funds-mental-health
  - 'on': 988 call centers
    text: The line fell from $500,000 to zero in FY2027; opioid-settlement appropriations carried money for 988
      in 2025 and 2026.
    term: '988'
  concepts:
  - how-alabama-funds-mental-health
  discussed_in:

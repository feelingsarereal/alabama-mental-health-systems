  - 31
  chart:
    type: bar
    x:
      field: label
      label: Count
    y:
      field: beds_per_100k
      label: Beds per 100,000 residents
  data: figures/data/fig-beds.csv
  caption: Alabama's involuntary (civil-commitment) bed capacity as the Department has reported it, beside the 30-per-100,000
    minimum of the Treatment Advocacy Center that the Department uses as its planning benchmark.
  how_to_read: 'Three bars: the count at the start of FY2025 (repeated in August 2025), the count as of 13 January
    2026, and the benchmark. The gap between the second and third bars is the 779 beds the Department prices in
    its January 2026 presentation. The bars count beds the Department treats as available under commitment orders,
    which include contracted community-hospital beds and crisis residential beds.'
  explain:
  - 'on': benchmark bar
    text: Thirty beds per 100,000 is a published minimum, not a law or a federal standard.
    term: beds-per-100000
  concepts:

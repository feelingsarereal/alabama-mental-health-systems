  summary: The section of Alabama's civil-commitment law that sets the test for outpatient commitment. A probate
    judge may order outpatient treatment on clear and convincing evidence that the respondent has a mental illness,
    will without treatment "suffer mental distress and experience deterioration of the ability to function independently",
    and "is unable to maintain consistent engagement with outpatient treatment on a voluntary basis", shown either
    by the person's actions in the two years before the hearing or by aspects of the clinical condition that impair
    decisions about treatment. Unlike the inpatient test in §22-52-10.4, it does not require a finding of a real
    and present threat of substantial harm. Subsection (b) sets the findings for renewing an outpatient order. Read
    in full through the fetch tool; this section is not among those covered by card X-d1-02.

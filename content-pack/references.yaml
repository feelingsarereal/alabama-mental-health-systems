  year: 2022
  summary: A three-page memorandum from the State Superintendent to local superintendents, dated 9 September 2022
    (posted 12 September), explaining Act 2022-442, codified at Code of Alabama 16-22-16.2. The Act requires every
    local education agency to employ a mental health services coordinator and to adopt a parental opt-in policy
    with annual written notice to parents, written permission from parents for students under the age of 14 to take
    part in ongoing counseling or mental health services, and mental-health records kept separately from academic
    records. 'Mental health services' is defined to include services, treatment, surveys or assessments. The opt-in
    does not apply where there is an imminent threat to the health of the student or others, or to occasional interventions
    that are regular duties of counselors; mandatory abuse reporting is unaffected. The memo does not mention grief
    support.

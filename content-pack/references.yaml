  year: 2025
  summary: Two sections of Alabama's Medicaid law. Section 22-6-12 says an inmate of a Department of Corrections
    institution 'shall have his or her eligibility for Medicaid suspended, but not terminated', allows temporary
    reinstatement for inpatient care of more than 24 hours outside the institution, and lets the institution try
    to establish or renew Medicaid eligibility before release. Section 22-6-13 applies the same suspend-not-terminate
    rule to county inmates and certain juveniles and required the Medicaid Agency and counties to set up a centralized
    process by 1 November 2017. The sections state the rule; they do not report how often eligibility is restored
    at release.

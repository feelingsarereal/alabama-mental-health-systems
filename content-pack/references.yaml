  year: 2026
  summary: 'The Alabama Department of Public Health''s web page for the Maternal Mortality Review Committee, last
    updated 30 July 2026. Its snapshot covers deaths in 2020 and 2021: of 137 deaths reviewed, 50 were pregnancy-related;
    78 percent of those were judged preventable; and the pregnancy-related mortality rate was 77.0 for Black non-Hispanic
    women against 28.2 for White non-Hispanic women (the page gives no unit). The leading causes listed are infection,
    hemorrhage and cardiomyopathy, with 28 percent due to COVID-19; the page text says nothing about mental health

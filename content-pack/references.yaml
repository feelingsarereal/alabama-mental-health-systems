  year: 2025
  summary: Four further sections of the civil-commitment article, read for what happens between the petition and
    the order. Section 22-52-4 says that when a petition is filed the probate judge "shall appoint a guardian ad
    litem to represent and to protect the rights of the respondent" (the fetch returned only part of this section).
    Section 22-52-7 lets the judge limit the respondent's liberty before the final hearing only where necessary
    to prevent a real and present threat of substantial harm or to stop the person leaving the court's jurisdiction,
    allows detention at a designated mental health facility or a hospital, and says "No respondent shall be placed
    in a jail or other facility for individuals accused of or convicted of committing crimes." Section 22-52-8 requires
    a probable-cause hearing within seven days whenever such a limitation or temporary treatment is imposed, and
    a final hearing within 30 days of service of the petition. Section 22-52-10.4(d) says nothing in that section
    requires "a mental health provider to expand his or her current services if necessary funding is not provided".
    The article's contents page lists thirty sections; the rest were not read for this card.

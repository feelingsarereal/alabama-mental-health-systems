  summary: ACES's evaluation of the six ADMH-funded crisis centers, cover-dated August 2025 and sent to the Commission
    on 4 September 2025 with a letter asking that it be treated as a preliminary report. It finds that the state
    has put $175 million into the centers since FY21 ($42 million a year now), that 16,414 interactions had taken
    place by the end of 2024, and that in FY24 average utilization was 27% and the average cost per bed day $2,193.
    It says centers collect the emergency-department and jail-avoidance measures inconsistently (one always reports
    zero jail avoidances), so ACES cannot verify the key performance indicators, and that there is insufficient
    data to judge effectiveness. ADMH's attached response questions the methodology behind the utilization and bed-cost
    figures and says most centers run at capacity most days.

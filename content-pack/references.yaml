  year: 2025
  summary: Six sections of Alabama's civil-commitment law, read in the 2025 edition of the Code. Any individual
    may petition the probate court of the county where the person is located for another person's involuntary commitment.
    The judge may order inpatient treatment on clear and convincing evidence that the person has a mental illness,
    poses a real and present threat of substantial harm to self or others, will continue to deteriorate without
    treatment and cannot make a rational decision about treatment; the least restrictive alternative necessary and
    available must be ordered. Inpatient and outpatient orders may not exceed 150 days, and a renewal may not exceed
    one year. Outpatient treatment may be ordered only if the designated mental health facility has consented. Probate
    judges must report commitment orders to the state law enforcement agency for firearms background checks.

  summary: The federal law that makes a planning council a condition of the Community Mental Health Services Block
    Grant. A state taking the grant must "establish and maintain a State mental health planning council". The council
    reviews the state's block-grant plans and recommends changes, advocates for adults with serious mental illness
    and children with severe emotional disturbance, and at least once a year monitors, reviews and evaluates the
    allocation and adequacy of mental health services in the state. Members must include adults who receive or have
    received mental health services and family members, and at least half must be people who are neither state employees
    nor providers. It is the general federal rule; it says nothing specific about Alabama's council.

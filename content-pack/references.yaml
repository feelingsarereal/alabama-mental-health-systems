    Beshear. It says Taylor Hardin's capacity rose from 140 to 225 beds, with about 200 filled and the remaining
    25 waiting on a plumbing repair, and that a jail-based telehealth restoration program has restored 32 people
    since summer 2025. It also reports that budget cuts in 2010 led to the loss of 725 beds, that 'Chairman Reynolds'
    put the cost of replacing 787 beds at $590 million, and that Commissioner Kim Boswell said a new revenue stream
    is needed.

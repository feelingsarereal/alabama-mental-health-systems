  summary: A memorandum from the State Superintendent to local superintendents, dated 29 September 2025, on how
    Act 2025-455 changes the school mental-health consent rules. It restates that Act 2022-442 requires each local
    education agency to employ a mental health services coordinator and to adopt a parental opt-in policy with annual
    written notice to parents, mental-health records stored separately from academic records, and written parental
    permission. It says Act 2025-455 requires written parental permission for students under 16 to take part in
    ongoing school counseling or mental health services, and widens the definition of mental health services to
    include surveys and assessments. Instruction, advisement and occasional interventions are stated to be outside
    the opt-in requirement. The memo does not name SB101, give an effective date, or mention grief support.

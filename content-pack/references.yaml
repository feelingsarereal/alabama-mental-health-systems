  summary: The 2021 update of the national System of Care framework for children's mental health; it says it 'builds
    on the 2010 update'. It keeps three core values, now worded as family and youth driven, community based, and
    culturally and linguistically responsive, and lists fourteen guiding principles. The principles the 2010 version
    already had remain, including a comprehensive array of services, individualized planning, interagency collaboration,
    support for the transition to adulthood, and data-driven accountability. New or strengthened principles cover
    trauma-informed care, integration of health and mental health care, a public health approach with prevention
    and early identification, and mental health equity. It is a national framework and does not discuss Alabama;
    the copy read is hosted by a Pennsylvania county association.
